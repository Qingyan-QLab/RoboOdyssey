[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "RoboOdyssey"
version = "0.2.2"
description = "Long-horizon embodied agent evaluation and reusable execution core for Isaac Sim"
readme = "README.md"
license-files = ["NOTICE", "roboodyssey/contracts/LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=9.0"]

[project.optional-dependencies]
reference = ["restools==0.0.1.3"]

[tool.setuptools.packages.find]
include = ["roboodyssey", "roboodyssey.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"roboodyssey.interaction" = ["protocol_schema.json"]
"roboodyssey.contracts" = ["LICENSE"]
"roboodyssey.reference_oracles" = ["ORIGIN.md"]

"roboodyssey.scenes" = ["robot_assets/**/*", "robot_assets/*"]
