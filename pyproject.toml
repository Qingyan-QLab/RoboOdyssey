[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longterm-indoor-benchmark"
version = "0.1.0"
description = "Standalone long-horizon indoor evaluation harness for Isaac Sim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=9.0"]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"benchmark.agents" = ["protocol_schema.json"]
"benchmark.contracts" = ["LICENSE"]
