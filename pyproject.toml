[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RoboOdyssey"
version = "0.1.0"
description = "Long-horizon embodied agent evaluation for continual adaptation across environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=9.0"]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"benchmark.agents" = ["protocol_schema.json"]
"benchmark.contracts" = ["LICENSE"]
